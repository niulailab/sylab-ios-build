name: Deploy iOS IPA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "build-ios run id (blank = latest successful build)"
        required: false
        default: ""
      artifact_name:
        description: "artifact name"
        required: true
        default: "sylab-ios-unsigned"
      tag:
        description: "download filename tag, e.g. v129 -> sylab-v129.ipa"
        required: true
        default: "v129"

jobs:
  deploy:
    runs-on: macos-15
    env:
      SSH_PASS: ${{ secrets.SSH_PASS_NEW }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: brew install hudochenkov/sshpass/sshpass || true; which sshpass
      - name: Resolve run id
        id: rid
        run: |
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            echo "rid=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
          else
            R=$(gh run list --workflow=build-ios.yml --status=success --branch=main --limit=1 --json databaseId --jq '.[0].databaseId')
            echo "rid=$R" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download artifact
        run: |
          mkdir -p dl && cd dl
          gh run download "${{ steps.rid.outputs.rid }}" --name "${{ github.event.inputs.artifact_name }}"
          ls -l
          test -f sylab-unsigned.ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Backup and upload
        run: |
          SSHO="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          TS=$(date +%Y%m%d%H%M%S)
          sshpass -p "$SSH_PASS" ssh $SSHO root@36.137.84.216 "
            mkdir -p /var/www/sylab-ios/backup;
            [ -f /var/www/sylab-ios/sylab-unsigned.ipa ] && cp /var/www/sylab-ios/sylab-unsigned.ipa /var/www/sylab-ios/backup/sylab-prev-$TS.ipa;
            cp /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/default.bak-$TS;
            echo backed-up"
          sshpass -p "$SSH_PASS" scp $SSHO dl/sylab-unsigned.ipa root@36.137.84.216:/var/www/sylab-ios/sylab-unsigned.ipa
          echo uploaded
      - name: Update nginx download tag and reload
        run: |
          SSHO="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          TAG="${{ github.event.inputs.tag }}"
          # 用服务器上的独立脚本做替换：只改 sylab-unsigned.ipa 这个 location 块内的 filename，
          # 不碰旧版本入口（v138 等）。脚本内部断言「必须恰好命中 1 行」，避免像内联 sed 那样静默不生效。
          sshpass -p "$SSH_PASS" ssh $SSHO root@36.137.84.216 "bash /root/sylab-fix-ipa-filename.sh $TAG"
          sshpass -p "$SSH_PASS" ssh $SSHO root@36.137.84.216 "grep -n 'Content-Disposition' /etc/nginx/sites-enabled/default"
      - name: Verify deployed
        run: |
          SSHO="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          TAG="${{ github.event.inputs.tag }}"
          sshpass -p "$SSH_PASS" ssh $SSHO root@36.137.84.216 "
            ls -l /var/www/sylab-ios/sylab-unsigned.ipa; md5sum /var/www/sylab-ios/sylab-unsigned.ipa"
          # 通过公网 https 地址校验真实下载名，避免本地根路径取不到 header
          # 用 Range GET 而不是 HEAD：CF 对 HEAD 常返回空 header，会造成误报
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          CD=$(curl -sk --max-time 60 -A "$UA" -r 0-0 -D - -o /dev/null "https://s.symsgf.xyz/sylab-ios/sylab-unsigned.ipa?cb=$(date +%s)" | grep -i 'content-disposition' || true)
          echo "$CD"
          echo "$CD" | grep -q "sylab-$TAG.ipa"
