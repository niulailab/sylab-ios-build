name: Deploy Native IPA via Runner SSH

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "The build run id whose artifact to deploy"
        required: true
        default: "36244342137"

jobs:
  deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract native IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID="${{ github.event.inputs.artifact_run_id }}"
          ART_URL=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);a=[x for x in d['artifacts'] if x['name']=='sylab-ios-unsigned'][0];print(a['archive_download_url'])")
          curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$ART_URL" -o art.zip
          rm -rf artx && mkdir artx
          unzip -o art.zip -d artx
          find artx -name '*.ipa' -exec cp {} sylab-unsigned.ipa \;
          ls -la sylab-unsigned.ipa
          unzip -l sylab-unsigned.ipa | head -8

      - name: Install sshpass
        run: brew install hudochenkov/sshpass/sshpass || true; which sshpass

      - name: Upload IPA and deploy script over SSH
        env:
          SSH_PASS: ${{ secrets.SSH_PASS_NEW }}
        run: |
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            sylab-unsigned.ipa root@36.137.84.216:/tmp/sylab-native-new.ipa
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/remote-deploy.sh root@36.137.84.216:/tmp/remote-deploy.sh

      - name: Run remote deployment
        env:
          SSH_PASS: ${{ secrets.SSH_PASS_NEW }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@36.137.84.216 "bash /tmp/remote-deploy.sh"

      - name: Verify public download
        run: |
          curl -sk --max-time 90 "https://s.symsgf.xyz/sylab-ios/sylab-unsigned.ipa?cb=$(date +%s)" -o verify.ipa
          ls -la verify.ipa
          unzip -l verify.ipa | head -8
