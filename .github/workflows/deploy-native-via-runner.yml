name: Deploy Native IPA via Runner SSH

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "The build run id whose artifact to deploy"
        required: true
        default: "36244342137"

jobs:
  deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download native IPA artifact from build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID="${{ github.event.inputs.artifact_run_id }}"
          ART_URL=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);a=[x for x in d['artifacts'] if x['name']=='sylab-ios-unsigned'][0];print(a['archive_download_url'])")
          curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$ART_URL" -o sylab-unsigned.ipa
          ls -la sylab-unsigned.ipa

      - name: Install sshpass
        run: brew install hudochenkov/sshpass/sshpass || true; which sshpass

      - name: Upload IPA and deploy script over SSH
        run: |
          sshpass -p 'd84w@1aSuT' scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            sylab-unsigned.ipa root@36.137.84.216:/tmp/sylab-native-new.ipa
          sshpass -p 'd84w@1aSuT' scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/remote-deploy.sh root@36.137.84.216:/tmp/remote-deploy.sh

      - name: Run remote deployment
        run: |
          sshpass -p 'd84w@1aSuT' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@36.137.84.216 "bash /tmp/remote-deploy.sh"

      - name: Verify public download
        run: |
          curl -skI --max-time 20 "https://s.symsgf.xyz/sylab-ios/sylab-unsigned.ipa" | grep -iE "HTTP|content-disposition|content-length"
