name: Rotate SSH Root Password
on:
  workflow_dispatch:
jobs:
  rotate:
    runs-on: macos-latest
    steps:
      - name: Install sshpass
        run: brew install hudochenkov/sshpass/sshpass || true; export PATH="/opt/homebrew/bin:$PATH"; which sshpass
      - name: Rotate and verify
        env:
          OP: ${{ secrets.SSH_PASS_OLD }}
          NP: ${{ secrets.SSH_PASS_NEW }}
        run: |
          set -e
          export PATH="/opt/homebrew/bin:$PATH"
          echo "== changing root password =="
          sshpass -p "$OP" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@36.137.84.216 "echo 'root:'\"$NP\" | chpasswd && echo CHPASSWD_OK"
          echo "== verify login with NEW password on a fresh connection =="
          sshpass -p "$NP" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@36.137.84.216 "echo NEW_LOGIN_OK; id -un; hostname"
