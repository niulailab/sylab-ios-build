name: Run Remote Script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "repo-relative remote script under scripts/"
        required: true
        default: "scripts/fix2.sh"
      extra_file:
        description: "optional repo-relative file to also scp to /tmp/_extra"
        required: false
        default: ""

jobs:
  run:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: brew install hudochenkov/sshpass/sshpass || true; which sshpass
      - name: Execute remote script
        env:
          SSH_PASS: ${{ secrets.SSH_PASS_NEW }}
        run: |
          S="${{ github.event.inputs.script }}"
          E="${{ github.event.inputs.extra_file }}"
          if [ -n "$E" ]; then
            sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$E" root@36.137.84.216:/tmp/_extra
          fi
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$S" root@36.137.84.216:/tmp/_run.sh
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@36.137.84.216 "bash /tmp/_run.sh 2>&1" | tee /tmp/_run_output.txt
          cat /tmp/_run_output.txt
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-output
          path: /tmp/_run_output.txt
          retention-days: 3
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-output
          path: /tmp/_run_output.txt
          retention-days: 3
