server {
    # listen 80 default_server;
    listen 9091;
    # listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Sylab v2 - fresh deployment
    location /sylab-v2/ {
        alias /var/www/sylab-v2/;
        index index.html;
        try_files $uri $uri/ /sylab-v2/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Client error logging
    location /api/client-error {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = "OPTIONS") { return 204; }
        proxy_pass http://127.0.0.1:9100/;
        proxy_http_version 1.1;
    }

    # Calendar service API proxy
    location /calendar-service/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = "OPTIONS") { return 204; }
        proxy_pass http://172.18.0.12:8940/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 15s;
    }

    # Calendar view page
    location = /calendar {
        alias /var/www/chat-sdk/calendar.html;
        default_type text/html;
    }

    # Sylab static web build - no cache
    # 带内容hash的静态资源：长缓存+immutable，让Cloudflare边缘与浏览器缓存，弱网秒开、防白屏
    location /_expo/static/ {
        root /var/www/chat-sdk;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location /assets/ {
        root /var/www/chat-sdk;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        root /var/www/chat-sdk;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Pragma 'no-cache' always;
        add_header Expires '0' always;
    }

    # Token service API
    location /token-api/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
            return 204;
        }
        add_header Access-Control-Allow-Origin '*' always;
        proxy_pass http://172.18.0.7:8989/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Skill library API -> coze-memory-service (8900)
    location /skill-api/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-API-Key' always;
            return 204;
        }
        add_header Access-Control-Allow-Origin '*' always;
        proxy_pass http://127.0.0.1:8900/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Coze Studio API
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
            return 204;
        }
        add_header Access-Control-Allow-Origin '*' always;
        proxy_pass http://172.18.0.103:8888;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        gzip off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /v3/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
            return 204;
        }
        add_header Access-Control-Allow-Origin '*' always;
        proxy_pass http://172.18.0.103:8888;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location /internal/ {
        # === LOCKDOWN 20260919: internal endpoint, closed on public nginx ===
        # backend agents reach these via container network (tool-proxy:9092), never via 9091
        return 404;
        add_header Access-Control-Allow-Origin '*' always;
        proxy_pass http://172.18.0.103:8888;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
    }

    # Tool-proxy file write API
    location = /file_write {
        # === LOCKDOWN 20260919: internal endpoint, closed on public nginx ===
        # backend agents reach these via container network (tool-proxy:9092), never via 9091
        return 404;
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = "OPTIONS") { return 204; }
    }

    location /v1/file/ {
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /v1/ {
        add_header Access-Control-Allow-Origin '*' always;
        proxy_pass http://172.18.0.103:8888;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
    }

    location /token-ui/ {
        # === LOCKDOWN 20260919: internal endpoint, closed on public nginx ===
        # backend agents reach these via container network (tool-proxy:9092), never via 9091
        return 404;
        proxy_pass http://172.18.0.7:8989/ui/;
    }

    # Tool-proxy file service (screenshots, downloads, etc.)
    # Web game / UI preview static publishing (AI-generated pages)
    location /play/ {
        alias /var/www/play/;
        index index.html;
        try_files $uri $uri/ /play/index.html;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    location /files/ {
        # === LOCKDOWN 20260919: block directory listing, keep file GET ===
        if ($uri = "/files/") { return 403; }
        proxy_pass http://127.0.0.1:9092/files/;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Access-Control-Allow-Origin '*' always;
    }

    # MinIO file proxy (external access to MinIO objects)
    location /minio-files/ {
        proxy_pass http://127.0.0.1:9092/minio-files/;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        add_header Access-Control-Allow-Origin '*' always;
    }

    # Tool-proxy (images, video, etc.)
    location /images/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Access-Control-Allow-Origin '*' always;
    }

    # Video content proxy (correct Content-Type for inline playback)
    # DAG progress polling (tool-proxy)
    location /dag/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Access-Control-Allow-Origin '*' always;
    }

    location /video/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        add_header Access-Control-Allow-Origin '*' always;
    }

    # Project files service
    location /project-files/ {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Conversation-Id, X-File-Name' always;
        add_header Access-Control-Max-Age '0' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://127.0.0.1:9093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Conversation-Id $http_x_conversation_id;
        proxy_set_header X-File-Name $http_x_file_name;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Voice API (ASR/TTS)
    location /api/asr/ {
        proxy_pass http://127.0.0.1:9102/api/asr/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    location /api/tts/ {
        proxy_pass http://127.0.0.1:9102/api/tts/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Network monitor service
    location /network-monitor/ {
        # === LOCKDOWN 20260919: internal endpoint, closed on public nginx ===
        # backend agents reach these via container network (tool-proxy:9092), never via 9091
        return 404;
        rewrite ^/network-monitor/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9098;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Security tools API service
    location /security-tools/ {
        # === LOCKDOWN 20260919: internal endpoint, closed on public nginx ===
        # backend agents reach these via container network (tool-proxy:9092), never via 9091
        return 404;
        rewrite ^/security-tools/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Chat Queue Service
    location /chat-queue/ {
        rewrite ^/chat-queue/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9088;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # User file upload (frontend -> tool-proxy, no auth required)
    location /user-upload {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Conversation-Id $http_x_conversation_id;
        proxy_set_header X-File-Name $http_x_file_name;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 50m;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Conversation-Id, X-File-Name" always;
        if ($request_method = "OPTIONS") { return 204; }
    }

    # Notification API service
    location /notifications/ {
        proxy_pass http://127.0.0.1:9092/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # Sylab iOS IPA force-download (prevent Safari inline garble)
    location = /sylab-ios/sylab-unsigned.ipa {
        alias /var/www/sylab-ios/sylab-unsigned.ipa;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="sylab-v131.ipa"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
        add_header Pragma no-cache always;
    }

    # Sylab iOS zip 兜底下载（Safari 对 zip 必存盘，杜绝内联乱码）
    location = /sylab-ios/sylab-v127.zip {
        alias /var/www/sylab-ios/sylab-v127.zip;
        types { }
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="sylab-v127.zip"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
        add_header Pragma no-cache always;
    }

    # Sylab iOS IPA download
    location /sylab-ios/ {
        alias /var/www/sylab-ios/;
        index index.html;
    }

    location /sylab-ios/manifest.plist {
        alias /var/www/sylab-ios/manifest.plist;
        types { }
        default_type application/xml;
    }
}





# Security-tools direct proxy (no path prefix)
server {
    listen 9101;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:9099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
    }
    # Sylab iOS IPA download
    location /sylab-ios/ {
        alias /var/www/sylab-ios/;
        index index.html;
    }

    location /sylab-ios/manifest.plist {
        alias /var/www/sylab-ios/manifest.plist;
        types { }
        default_type application/xml;
    }
}

